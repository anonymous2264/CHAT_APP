<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>CHAT APP</title>
</head>
<body>
    <h1 class="title">My Chat 🗨️ </h1>
    <div class="main">
        <div class="name">
            <span><i class="far fa-user"></i></span>
            <input type="text" id="name-input" class="name-input" value="anonymous" maxlength="20">
        </div>
        <ul class="message-container" id="message-container">
            <li class="message-left">
                <p class="message">
                    Lorem ipsum
                    <span>bluebird 🟢 26 17th June 6:40</span>
                </p>
            </li>
            <li class="message-right">
                <p class="message">
                    Lorem ipsum
                    <span>bluebird 🟢 26 17th June 6:40</span>
                </p>
            </li>

            <li class="message-feedback">
                <p class="feedback" id="feedback">
                    killer is typing a message
                </p>
            </li>
        </ul>
      <form class="message-form" id="message-form">
    <input type="text" name="message" id="message-input" class="message-input">
<button type="button" id="start-record" class="record-button">
    <i class="fas fa-microphone"></i>
</button>

<button type="button" id="stop-record" class="stop-button">
    <i class="fas fa-stop"></i>
</button>

    <div class="v-divider"></div>

    <button type="submit" class="send-button">
    <i class="fas fa-paper-plane"></i>
</button>
</form>

    </div>
            <h3 class="clients-total" id="clients-total">Total Clients: 2</h3>
        <script src="/socket.io/socket.io.js"></script>
       <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
        <script src="main.js"></script>
        </body>
</html>
